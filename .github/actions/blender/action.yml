name: blender
description: install Blender and the Python packages the scripts need
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: bl
      with:
        path: blender
        key: blender-5.3.0-linux-x64-dacb8264
    - if: steps.bl.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz" -o b.tar.xz
        echo "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05  b.tar.xz" | sha256sum -c -
        mkdir blender && tar -xf b.tar.xz -C blender --strip-components=1
        rm b.tar.xz
    - shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 >/dev/null
        PY=$(ls blender/*/python/bin/python3.* | grep -v config | head -1)
        "$PY" -m ensurepip >/dev/null 2>&1 || true
        "$PY" -m pip install -q --target tools/city/vendor --no-deps --only-binary=:all: -r tools/city/requirements.txt
